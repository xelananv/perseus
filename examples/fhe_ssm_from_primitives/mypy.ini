[mypy]
python_version = 3.12
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
ignore_missing_imports = True
follow_imports = silent
# make the per-module `follow_imports = skip` below apply to stub (.pyi) files as well: without
# it mypy reads perseus/_core.pyi whenever perseus is found as source rather than as installed
follow_imports_for_stubs = True

# The CUDA extension's generated stubs are not this example's code.
[mypy-perseus._core]
follow_imports = skip

[mypy-perseus._client]
follow_imports = skip
